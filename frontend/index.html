<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#153b32" />
    <meta name="description" content="整合帳戶、交易、投資與財務目標的個人財務工具" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="財務居" />
    <script>
      (() => {
        try {
          const dark = localStorage.getItem("finance:theme") === "dark";
          const color = dark ? "#0b1210" : "#f5f7f4";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
          document.documentElement.style.backgroundColor = color;
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", color);
          document
            .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
            ?.setAttribute("content", dark ? "black-translucent" : "default");
        } catch {
          // Keep the light defaults if storage is unavailable.
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/finance-home-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/finance-home-icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/finance-home-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/finance-home-touch-icon.png" />
    <title>財務居</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
